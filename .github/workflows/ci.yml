name: CI

on: pull_request

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:latest
    steps:
    - uses: actions/checkout@v7.0.1
    - run: swift test --only-use-versions-from-resolved-file --parallel --filter OfflineTests
  lint:
    runs-on: ubuntu-latest
    container: swift:latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: swift format lint -r -p -s .
